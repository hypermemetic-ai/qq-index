# qq-index's headless writer overlay. Model-pass supplies the frozen contract
# plus deterministic evidence packet. DSH imports plugin `name` before
# evaluating !!js, so model-pass replaces every token with an absolute URL.

- id: system-prompt
  config:
    persona: !!js process.env.QQ_INDEX_WRITER_PROMPT

- id: agent-default-model
  config:
    provider: !!js process.env.QQ_DSH_PROVIDER
    model: !!js process.env.QQ_DSH_MODEL

- id: sandbox-policy
  config:
    mode: workspace-write
    workspaceRoot: !!js process.cwd()

- id: approval
  config:
    policy: never

- id: permission
  disabled: true

- id: tools
  config:
    mode: native

# Mini Docs wraps inherited bash and restricts the runtime catalog to it.
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true

- id: attachment-local
  disabled: true
- id: agent-instructions
  disabled: true
- id: plan-mode
  disabled: true
- id: code-runtime
  disabled: true

- insert:
    - id: qq-index-models
      name: __QQ_INDEX_MODELS_ROOT__
    - id: qq-index-writer-boot
      name: __QQ_INDEX_WRITER_BOOT_PLUGIN__

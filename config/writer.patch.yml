# qq-wiki's headless writer overlay. The wrapper supplies the frozen packet in
# the environment. DSH imports plugin `name` before evaluating !!js, so
# model-pass replaces every token below with an absolute file: URL.

- id: system-prompt
  config:
    persona: !!js process.env.QQ_WIKI_WRITER_PROMPT

- id: agent-default-model
  config:
    provider: !!js process.env.QQ_DSH_PROVIDER
    model: !!js process.env.QQ_DSH_MODEL

- id: sandbox-policy
  config:
    mode: workspace-write
    workspaceRoot: !!js process.cwd()

- id: approval
  config:
    policy: never

- id: permission
  disabled: true

- id: tools
  config:
    mode: native

# Mini Docs wraps the inherited bash tool and restricts the runtime catalog to
# that replacement. Do not register native filesystem discovery or edit tools.
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true

# These prompt/presentation bundles are unused by the complete Mini Docs
# persona. tool-bash deliberately remains enabled for Mini Docs to wrap.
- id: attachment-local
  disabled: true
- id: agent-instructions
  disabled: true
- id: plan-mode
  disabled: true
- id: code-runtime
  disabled: true

- insert:
    - id: qq-wiki-models
      name: __QQ_WIKI_MODELS_ROOT__
    - id: qq-mini-docs
      name: __QQ_WIKI_MINI_DOCS_PLUGIN__
    - id: qq-wiki-writer-boot
      name: __QQ_WIKI_WRITER_BOOT_PLUGIN__
